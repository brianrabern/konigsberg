name: ci

on:
  push:
  pull_request:

jobs:
  trust-gates:
    # The merge-time half of the trust guarantee. Runs without a Lean build:
    # validates status.toml shape and recorded axioms. The authoritative
    # per-declaration axiom check runs in the `lean` job with --run-lean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: audit self-test (planted sorry/axiom/native_decide)
        run: uv run python ci/self_test_audit.py
      - name: referee self-test (planted flawed claims)
        run: uv run python ci/referee_self_test.py
      - name: reduction self-test (reducible-configuration engine)
        run: uv run python ci/reduction_self_test.py
      - name: discharging self-test (discharging engine)
        run: uv run python ci/discharging_self_test.py
      - name: status schema
        run: uv run python ci/check_status.py formal
      - name: no sorry in formalized entries
        run: uv run python ci/check_no_sorry.py formal
      - name: axiom whitelist (recorded)
        run: uv run python ci/check_axioms.py formal
      - name: import coverage
        run: uv run python ci/check_imports.py formal
      - name: Literature conventions
        run: uv run python ci/check_conventions.py formal

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  lean:
    # The authoritative half of the trust guarantee: build formal/ against the
    # frozen mathlib (prebuilt cache — never from source), verify the REPL
    # round-trips, then run the per-declaration axiom gate against the live env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
      - uses: astral-sh/setup-uv@v3
      - name: environment round-trips (M0 smoke)
        run: make lean-smoke
      - name: axiom whitelist (live #print axioms)
        run: make axioms-lean
