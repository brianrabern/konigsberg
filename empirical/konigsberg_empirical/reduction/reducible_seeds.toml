# Rabern / Cranston–Rabern forbidden-configuration seeds (Δ = 9 low-vertex regime).
#
# Each seed is a configuration they proved reducible (or that their f-choosable-join
# method immediately yields as an all-low-vertex core: f(v) = deg_K(v)).
# The engine re-derives reducibility; this file only supplies core + degree spec
# so the hunt starts from the known catalogue, not from C₄ invented at random.
#
# graph6 strings are networkx/graph6_encode output (same as make_graph).

[[seed]]
name = "CR_low_P3"
source = "Cranston–Rabern, Coloring a graph with Δ−1 colors (arXiv:1203.5380); even-path of low vertices"
core = "Bg"
degrees = [8, 8, 8]
D = 9
note = "P₃, all low (d_G = D−1). Self-test HIT. Re-derive before inventing cores."

