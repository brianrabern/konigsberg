[project]
name = "konigsberg-empirical"
version = "0.0.0"
description = "Empirical tier: enumeration, SAT/ILP, choosability solvers"
requires-python = ">=3.11"
dependencies = [
    # networkx is a convenience for the shared graph representation; the core
    # canonical form is our own (see core/graph.py). Keep heavy solvers optional.
    "networkx>=3",
]

[project.optional-dependencies]
sat = ["python-sat>=1.8"]        # optional: SAT/ILP backend (open decision #2)
sage = []                        # optional Sage backend — install separately

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["konigsberg_empirical"]
