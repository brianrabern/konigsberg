[project]
name = "konigsberg-empirical"
version = "0.0.0"
description = "Empirical tier: enumeration, SAT/ILP, choosability solvers"
requires-python = ">=3.11"
dependencies = [
    # networkx is a convenience for the shared graph representation; the core
    # canonical form is our own (see core/graph.py).
    "networkx>=3",
    # SAT/CEGAR (choosability_refute, BK-attack) — hard runtime dep for the
    # konigsberg product; missing pysat previously left the empirical tier silent.
    "python-sat>=1.8",
]

[project.optional-dependencies]
sat = ["python-sat>=1.8"]        # alias kept for older `uv sync --extra sat` docs
sage = []                        # optional Sage backend — install separately

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["konigsberg_empirical"]

[tool.hatch.build.targets.wheel.force-include]
"konigsberg_empirical/reduction/reducible_seeds.toml" = "konigsberg_empirical/reduction/reducible_seeds.toml"
