name = "konigsberg"
defaultTargets = ["Konigsberg"]

[leanOptions]
# Unbound identifiers must not silently become fresh ∀-variables — a typo in a
# theorem statement would then compile as a different (often vacuous) claim.
# See docs/TRUST.md and docs/handoff/FIDELITY_GATES.md (WP2).
autoImplicit = false
relaxedAutoImplicit = false

# mathlib is a DEPENDENCY, never a fork. Pinned by tag here as a floor; the real
# freeze is the commit written into lake-manifest.json by `lake update` — COMMIT
# that file. Bump deliberately, never incidentally.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

# The Lean REPL, pinned to its v4.31.0 branch so its toolchain matches ours
# (a mismatch fails to load mathlib's oleans). Depends only on Lean core, so it
# cannot conflict with mathlib's dependency set. Provides the `repl` exe that the
# harness drives via `lake exe repl`. Frozen, like mathlib, in lake-manifest.json
# by `lake update` — COMMIT that file.
[[require]]
name = "REPL"
git = "https://github.com/leanprover-community/repl"
rev = "v4.31.0"

[[lean_lib]]
name = "Konigsberg"
